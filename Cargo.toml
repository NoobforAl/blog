[package]
name = "blog"
version = "0.2.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
pulldown-cmark = "0.13"
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "Location", "Node", "HtmlHeadElement"] }

[build-dependencies]
serde_yaml = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
