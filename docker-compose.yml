# Blog backend, meant to sit behind your existing reverse proxy (HAProxy).
# The proxy terminates TLS and forwards traffic to this service on the shared
# `web` network; this container only speaks plain HTTP internally (no published
# host ports).
#
# Usage:
#   SITE_URL=https://example.com docker compose up -d --build
#
# Config (override via a .env file or the shell):
#   SITE_URL      primary/canonical domain, baked into canonical tags,
#                 sitemap.xml and feed.xml at build time (single value).
#   CORS_ORIGINS  comma-separated list of origins allowed to make cross-origin
#                 requests (your domains). Defaults to "*".

services:
  blog:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    image: blog:latest
    restart: unless-stopped
    expose:
      - "80"            # internal only; the reverse proxy reaches it on :80
    environment:
      SERVER_CORS_ALLOW_ORIGINS: ${CORS_ORIGINS:-*}
    networks:
      - web

networks:
  # The network shared with your reverse proxy. If the proxy lives in another
  # compose project, create it once (`docker network create web`) and it is
  # marked external here. To run this stack standalone, delete `external: true`.
  web:
    external: true
